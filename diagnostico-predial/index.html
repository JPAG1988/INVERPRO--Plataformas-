<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Diagnóstico Predial · Ganadería Regenerativa</title>
<meta name="description" content="Diagnóstico de 7 preguntas para saber el punto de partida de su finca hacia la ganadería regenerativa." />
<script src="https://cdn.tailwindcss.com"></script>
<style>body{margin:0}#carga{min-height:100vh;display:flex;align-items:center;justify-content:center;color:#6B4A2F;font-family:system-ui,sans-serif}</style>
</head>
<body>
<div id="root"><div id="carga">Cargando diagnóstico…</div></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script>
  // Carga diagnostico-predial.jsx y lo monta sin empaquetador.
  fetch("diagnostico-predial.jsx?v=1")
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function (src) {
      src = src.replace(/^import \{([^}]+)\} from "react";/m, "const {$1} = React;")
               .replace("export default function DiagnosticoPredial", "function DiagnosticoPredial");
      src += "\nReactDOM.createRoot(document.getElementById('root')).render(React.createElement(DiagnosticoPredial));";
      var code = Babel.transform(src, { presets: [["react", { runtime: "classic" }]], filename: "diagnostico-predial.jsx" }).code;
      var s = document.createElement("script"); s.text = code; document.body.appendChild(s);
    })
    .catch(function (e) {
      document.getElementById("root").innerHTML = '<p style="font-family:system-ui;max-width:480px;margin:60px auto">No se pudo cargar el diagnóstico: ' + e.message + '</p>';
    });
</script>
</body>
</html>
